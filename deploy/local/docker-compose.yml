services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tradeflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "${SQLSERVER_PORT}:1433"
    volumes:
      - tradeflow-sql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  tradeflow-sql-data: